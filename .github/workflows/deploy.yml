name: Deploy to Hostinger Subdomain
on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install xlsx jsbarcode @zxing/browser @zxing/library lucide-react @tanstack/react-query @supabase/supabase-js framer-motion clsx tailwind-merge --save --legacy-peer-deps

      - name: Build project
        run: |
          sed -i "/lovable-tagger/d" vite.config.ts
          npm run build
        env:
          VITE_SUPABASE_URL: "https://vznzdkpcroccuklfjxac.supabase.co"
          VITE_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ6bnpka3Bjcm9jY3VrbGZqeGFjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0NTQ2MjQsImV4cCI6MjA5MzAzMDYyNH0.xvTxabYlNW6gq_BbQsCj2UZJLXboC85-P0B78z1dlOA"

      - name: Prepare Files
        run: |
          echo 'Options -MultiViews
          RewriteEngine On
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteRule . /index.html [L]' > dist/.htaccess

      - name: Install SFTP password helper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y sshpass

      - name: Verify Hostinger SSH fingerprint
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          key_file="$(mktemp)"
          ssh-keyscan -T 10 -t ed25519 -p 65002 "$FTP_SERVER" 2>/dev/null > "$key_file"
          actual_fingerprint="$(ssh-keygen -lf "$key_file" -E sha256 | awk 'NR == 1 { print $2 }')"
          expected_fingerprint="SHA256:hJg0zax3LfUTlG9TMwDCFWtXxO1TPe7/T2NgMEv6OrA"
          if [[ "$actual_fingerprint" != "$expected_fingerprint" ]]; then
            echo "::error::Hostinger SSH fingerprint mismatch"
            exit 1
          fi
          cat "$key_file" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          rm -f "$key_file"
          echo "Hostinger SSH fingerprint verified."

      - name: Deploy to Hostinger via SFTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          SSHPASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          remote_dir="/home/${FTP_USERNAME}/domains/almalkieducational.com/public_html/aldaahia"
          printf 'cd %s\npwd\nlcd dist\nput -r *\nput .htaccess\n' "$remote_dir" | sshpass -e sftp \
            -P 65002 \
            -oBatchMode=no \
            -oStrictHostKeyChecking=yes \
            -oUserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -oPreferredAuthentications=password \
            -oPubkeyAuthentication=no \
            "${FTP_USERNAME}@${FTP_SERVER}"
